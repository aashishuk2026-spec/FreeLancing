<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glitch and Grit</title>

    <!-- BootStrap CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="enquiry.css">
</head>

<body>

<!-- 
    <!-- Main Section -->
    <main>

        <!-- Enquiry Form Section -->
        <section class="enquiry-section py-5">
            <div class="container">
                <h1>Start a Project</h1>
                <p>Tell us about your project and how we can help you bring it to life. We reply within 2 working days.</p>
            </div>
        </section>
<!-- Contact Section -->
<section class="contact py-5">
    <div class="container">
        <div class="row">

            <!-- Left column: Contact Information -->
            <div class="col-md-16">
                <h2>Prefer to contact us directly?</h2>
            </div>

            <!-- Right column: Enquiry Form -->
            <div class="col-md-8">
                <form novalidate>

                    <div id="enquiry-status" role="status" aria-live="polite"></div>

                    <div class="mb-3">
                        <label for="first-name" class="form-label">First Name *</label>
                        <input type="text" id="first-name" name="FirstName" class="form-control" autocomplete="given-name" aria-describedby="first-name-error">
                        <p id="first-name-error" class="first-name-error-message" role="alert" aria-live="polite"></p>
                    </div>

                    <div class="mb-3">
                        <label for="last-name" class="form-label">Last Name *</label>
                        <input type="text" id="last-name" name="LastName" class="form-control" autocomplete="family-name" aria-describedby="last-name-error">
                        <p id="last-name-error" class="last-name-error-message" role="alert" aria-live="polite"></p>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" id="email" name="Email" class="form-control" autocomplete="email" aria-describedby="email-error">
                        <p id="email-error" class="email-error-message" role="alert" aria-live="polite"></p>
                    </div>

                    <div class="mb-3">
                        <label for="phone-number" class="form-label">Phone Number (optional)</label>
                        <input type="tel" id="phone-number" name="Phone" class="form-control" placeholder="+44 7123 456789" autocomplete="tel" aria-describedby="phone-number-error">
                        <p id="phone-number-error" class="phone-number-error-message" role="alert" aria-live="polite"></p>
                    </div>

                    <div class="project-budget-options"
                        <div class="mb-3">
                            <label for="project" class="form-label">Type of Project *</label>
                            <select id="project" name="project" class="form-select" aria-describedby="project-error">
                                <option value="">Choose one...</option>
                                <option value="website">Website Development</option>
                                <option value="uiux">UI/UX Design</option>
                                <option value="app">Desktop/Mobile Application Development</option>
                                <option value="ai">Artificial Intelligence</option>
                                <option value="game">Game Development</option>
                                <option value="cloud">Cloud Development</option>
                            </select>
                            <p id="project-error" class="project-error-message" role="alert" aria-live="polite"></p>
                        </div>

                        <div class="mb-3">
                            <label for="project-budget" class="form-label">Project Budget *</label>
                            <select id="project-budget" name="projectBudget" class="form-select" aria-describedby="project-budget-error">
                                <option value="">Choose one...</option>
                                <option value="low">Under £4,000</option>
                                <option value="medium">£4,000 - £10,000</option>
                                <option value="high">£10,000 - £20,000</option>
                                <option value="very-high">Over £20,000</option>
                            </select>
                            <p id="project-budget-error" class="project-budget-error-message" role="alert" aria-live="polite"></p>
                        </div>
                    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1H6k9E6b5g5l5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e" crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="enquiry.js"></script>  

</body>
</html>
